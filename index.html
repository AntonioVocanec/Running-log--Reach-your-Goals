<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Tabs</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
  </head>
  <body>
    <h1>Running log, Reach your Goals</h1>
    <div class="tab-container">
      <!-- Tab buttons -->
      <div class="tab-buttons">
        <button class="tab-button active" data-tab="tab1">Run Log</button>
        <button class="tab-button" data-tab="tab2">Metrics</button>
        <button class="tab-button" data-tab="tab3">Weekly</button>
        <button class="tab-button" data-tab="tab4">Settings</button>
      </div>

      <!-- Tab content -->
      <div class="tab-content active" id="tab1">
        <p>This is where you’ll input your daily run data.</p>
        <form id="runForm">
          <label for="d">Distance</label>
          <input type="text" id="d" name="distance" placeholder="Distance.." />

          <label for="HR">Heart Rate</label>
          <input
            type="text"
            id="HR"
            name="heartrate"
            placeholder="Heart Rate.."
          />

          <label for="cadance">Cadence</label>
          <input
            type="text"
            id="cadance"
            name="cadance"
            placeholder="Cadence.."
          />

          <label for="time">Pace</label>
          <input type="text" id="time" name="time" placeholder="00:00" />

          <label for="RE">Relative Effort</label>
          <select id="RE" name="relativeEffort">
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
          </select>

          <label for="Comments">Comments</label>
          <textarea
            id="subject"
            name="comments"
            placeholder="How did the run go.."
            style="height: 200px"
          ></textarea>
          <button id="saveButton" type="button">Save</button>
        </form>
      </div>
      <div class="tab-content" id="tab2">
        <p>A section for tracking long-term trends across various metrics.</p>
        <section id="charts">
          <!-- Distance Chart -->
          <div>
            <h2>Distance Chart</h2>
            <canvas id="metricsChartDistance"></canvas>
          </div>
          
          <!-- Heart Rate Chart -->
          <div>
            <h2>Heart Rate Chart</h2>
            <canvas id="metricsChartHeartRate"></canvas>
          </div>

          <!-- Cadance Chart -->
          <div>
            <h2>Cadance Chart</h2>
            <canvas id="metricsChartCadence"></canvas>
          </div>

          <!-- Cadance Pace -->
          <div>
            <h2>Pace Chart</h2>
            <canvas id="metricsChartPace"></canvas>
          </div>
        </section>
      </div>
      <div class="tab-content" id="tab3">
        <p>A place for you to review your week.</p>
      </div>
      <div class = "tab-content" id="tab4">
        <p>Simple settings menu</p>
        <button id="modeSwitcher" type="button">Switch to Dark Mode</button>
        <div>
          <button id="ereaseData" type="button">Erease Data</button>
        </div>
      </div>
    </div>

    <script src="runlog.js"></script>
    <script src="tabs-switch-logic.js"></script>
    <script src="theme-switch.js"></script>
    <script src="metrics.js"></script>
    <script src="erease-data.js"></script>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>
    <script src="node_modules/chart.js/dist/chart.umd.js"></script>
</html>
